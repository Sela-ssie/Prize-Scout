<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Prize Scout</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 800px; margin: 2rem auto; }
      .result { border: 1px solid #ddd; padding: 1rem; margin-bottom: 1rem; }
    </style>
  </head>
  <body>
    <h1>Prize Scout</h1>
    <p>Search YouTube for giveaways.</p>
    <input id="q" placeholder="search term" />
    <button id="btn">Search</button>
    <div id="out"></div>

    <script>
      const out = document.getElementById('out');
      document.getElementById('btn').addEventListener('click', async ()=>{
        const q = document.getElementById('q').value;
        out.innerHTML = 'Searching...';
        const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
        const data = await res.json();
        out.innerHTML = '';
        if(!data.results.length) { out.innerHTML = '<p>No giveaways found.</p>'; return }
        data.results.forEach(r=>{
          const el = document.createElement('div'); el.className='result';
          el.innerHTML = `<h3><a href="${r.video_url}" target="_blank">${r.video_title}</a></h3>`+
            `<p><strong>Prizes:</strong> ${r.prizes||'N/A'}</p>`+
            `<p><strong>Deadline:</strong> ${r.deadline||'N/A'}</p>`+
            `<p><strong>How to enter:</strong> ${r.howto||'N/A'}</p>`;
          out.appendChild(el);
        })
      })
    </script>
  </body>
</html>
